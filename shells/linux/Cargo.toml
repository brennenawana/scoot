[package]
name = "scoot-linux"
version = "0.1.0"
edition = "2021"
description = "Scoot's Linux shell — tray citizen, nudge styles, platform signals (docs/PORTS.md §8)"
license = "MIT"

[[bin]]
name = "scoot"
path = "src/main.rs"

[dependencies]
scoot-core = { path = "../../core-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DBus, pure Rust (no libdbus-1-dev on the build host): logind session
# signals and org.gnome.Mutter.IdleMonitor. blocking API keeps the shell a
# plain threaded program — no async runtime in the judgment path.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# StatusNotifierItem tray — the path PORTS.md §8 names. Rides the same
# zbus/async-io stack, so the tray adds no second runtime.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

# X11, pure Rust protocol implementation: XScreenSaver idle clock and the
# override-redirect overlay window. No libx11/libxcb headers needed.
x11rb = { version = "0.14", features = ["screensaver", "shape", "xfixes", "randr"] }

# Sprite sheets and tray atlases are committed PNGs (CONTRACTS.md §8.1).
png = "0.18"

# The chime, per the degradation table ("rodio acceptable"). ALSA/PipeWire
# via cpal; needs libasound2-dev at build time.
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
