name: rust

# core-rs must be conformant on both port targets (docs/PORTS.md §6):
# the golden vectors are the contract, cargo test is the enforcement.
on:
  push:
    paths:
      - "core-rs/**"
      - "Cargo.*"
      - "tests/golden/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "core-rs/**"
      - "Cargo.*"
      - "tests/golden/**"
      - ".github/workflows/rust.yml"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
