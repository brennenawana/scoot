name: rust

# core-rs must be conformant on both port targets (docs/PORTS.md §6):
# the golden vectors are the contract, cargo test is the enforcement.
#
# The Windows shell is a workspace member but compiles to an empty stub off
# Windows (see shells/windows/src/main.rs), and its Win32 dependencies are
# target-gated — so one `cargo test --workspace` is correct on both runners.
# The shell's own suite only really runs on windows-latest, which is the point.
on:
  push:
    paths:
      - "core-rs/**"
      - "shells/**"
      - "Cargo.*"
      - "Tests/golden/**"
      - "Sources/Scoot/Resources/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "core-rs/**"
      - "shells/**"
      - "Cargo.*"
      - "Tests/golden/**"
      - "Sources/Scoot/Resources/**"
      - ".github/workflows/rust.yml"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
